version: '3.8'

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    environment:
      - MLFLOW_TRACKING_URI=/mlruns

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: python dashboard.py
    ports:
      - "8050:8050"
    volumes:
      - .:/app
    depends_on:
      - pipeline
